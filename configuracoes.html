<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações — Controle Financeiro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="background-grid"></div>
<div class="orb one"></div>
<div class="orb two"></div>
<div class="orb three"></div>

<div class="app">

    <!-- ==============================
         SIDEBAR
    ============================== -->

    <aside class="sidebar">

        <div class="logo">

            <div class="logo-icon">
                💰
            </div>

            <span>Controle Financeiro</span>

        </div>

        <nav>
            <a href="index.html"  id="nav-index">
                <span>⌂</span>
                <strong>Dashboard</strong>
            </a>
            <a href="transacoes.html"  id="nav-transacoes">
                <span>↕</span>
                <strong>Transações</strong>
            </a>
            <a href="relatorios.html"  id="nav-relatorios">
                <span>◉</span>
                <strong>Relatórios</strong>
            </a>
            <a href="configuracoes.html"  id="nav-configuracoes" class="active">
                <span>⚙</span>
                <strong>Configurações</strong>
            </a>
        </nav>

    </aside>


    <!-- ==============================
         MAIN
    ============================== -->

    <main class="main">

        <header class="header">
            <div>
                <h1>Configurações</h1>
                <p>Ajuste suas preferências e perfil.</p>
            </div>
            <div class="profile"><div class="avatar">H</div></div>
        </header>

        <section class="panel" style="max-width: 600px; margin: 0 auto;">
            <form id="configForm">
                <div class="form-group">
                    <label>Seu Nome de Usuário</label>
                    <input type="text" id="configNome" placeholder="Digite seu nome...">
                </div>
                
                <div class="form-group" style="margin-top: 25px;">
                    <label>Tema da Aplicação</label>
                    <select id="configTema">
                        <option value="escuro" selected>Tema Escuro (Padrão 3D)</option>
                        <option value="claro">Tema Claro Elegante</option>
                    </select>
                </div>
                
                <button type="submit" class="submit" style="margin-top: 30px;">Salvar Preferências</button>
            </form>
            <p id="configMsg" style="color: var(--green); text-align: center; margin-top: 15px; display: none;">Salvo com sucesso!</p>

            <hr style="border: 0; border-top: 1px solid var(--card-border); margin: 30px 0;">

            <div style="text-align: center;">
                <h4 style="font-size: 15px; font-weight: 800; color: var(--red); margin-bottom: 8px;">Zona de Reset</h4>
                <p style="font-size: 13px; color: var(--muted); margin-bottom: 16px;">Deseja apagar todas as movimentações, conquistas e configurações salvas no navegador?</p>
                <button type="button" onclick="resetarDados()" class="btn-reset-data">
                    🗑️ Apagar Todos os Dados do LocalStorage
                </button>
            </div>
        </section>

</main>

</div>


<!-- ==============================
     MODAL
============================== -->

<div
    class="modal"
    id="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>
                Nova transação
            </h2>

            <button
                class="close"
                onclick="closeModal()">

                ×

            </button>

        </div>


        <form id="transactionForm">

            <div class="form-group">

                <label>
                    Descrição
                </label>

                <input
                    id="description"
                    type="text"
                    placeholder="Ex: Mercado"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Valor
                </label>

                <input
                    id="amount"
                    type="number"
                    step="0.01"
                    placeholder="0,00"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Tipo
                </label>

                <select id="type">

                    <option value="expense">
                        Despesa
                    </option>

                    <option value="income">
                        Receita
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Categoria
                </label>

                <select id="category">

                    <option>
                        Alimentação
                    </option>

                    <option>
                        Moradia
                    </option>

                    <option>
                        Transporte
                    </option>

                    <option>
                        Entretenimento
                    </option>

                    <option>
                        Saúde
                    </option>

                    <option>
                        Outros
                    </option>

                </select>

            </div>


            <button
                class="submit"
                type="submit">

                Adicionar transação

            </button>

        </form>

    </div>

</div>



<script src="js/core.js"></script>
<script src="js/stats.js"></script>
<script src="js/user.js"></script>
<script src="js/background3d.js"></script>
<script src="js/configuracoes.js"></script>
</body>
</html>
